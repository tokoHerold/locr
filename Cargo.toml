[package]
name = "locr"
version = "0.1.1"
edition = "2024"
build = "build.rs"

[lib]
name = "locr"
crate-type = ["rlib"]

[[bin]]
name = "locr"
path = "src/bin/locr.rs"
required-features = ["cli"]

[features]
default = ["cli", "paddleocr-rec-tiny", "backend-ort"]
cli = ["dep:clap"]
# Backends:
backend-ort = ["dep:ort"]
backend-burn = ["dep:burn", "dep:burn-onnx"]
# Recognition model variants
paddleocr-rec-tiny = []
paddleocr-rec-medium = []
# Execution providers
cuda = ["ort/cuda"]
directml = ["ort/directml"]
coreml = ["ort/coreml"]

[dependencies]
burn = { version = "0.22.0", features = ["wgpu"], optional = true }
burn-onnx = { version = "0.22.0", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
image = "0.25.10"
imageproc = "0.27.0"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# ort = "2.0.0-rc.13"
serde-saphyr = "1.3.0"
burn-onnx = { version = "0.22.0", optional = true }
