[package]
name = "locr"
version = "0.1.1"
edition = "2024"
build = "build.rs"

[lib]
name = "locr"
crate-type = ["rlib"]

[[bin]]
name = "locr"
path = "src/bin/locr.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
# Execution providers
cuda = ["ort/cuda"]
directml = ["ort/directml"]
coreml = ["ort/coreml"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
image = "0.25.10"
imageproc = "0.27.0"
ndarray = "0.17.2"
ort = "2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ort = "2.0.0-rc.13"
serde-saphyr = "1.3.0"
