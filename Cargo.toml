[package]
name = "locr"
version = "0.1.1"
edition = "2024"
build = "build.rs"


[features]
default = ["cuda"]
# Execution providers
cuda = ["ort/cuda"]
directml = ["ort/directml"]
coreml = ["ort/coreml"]

[dependencies]
image = "0.25.10"
imageproc = "0.27.0"
ndarray = "0.17.2"
ort = "2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ort = "2.0.0-rc.13"
serde-saphyr = "1.3.0"
